project_name: MyCMakeProject
version: 1.0.0
author: Your Name

directories:
  src:
    main:
      core:
      utils:
        math:
        string:
    tests:
      unit_tests:
      utils_tests:
  docs:
    api_docs:

dependencies:
  external_lib:
    git: https://github.com/Nice0Man/cpp_template_repo.git
    version: 1.2.3
    branch: master

compiler:
  compiler_type: gccm  
  compiler_path: /usr/bin/gcc
  cxx_standard: 17
  flags:
    - -Wall
    - -Wextra
    - -Werror
  defines:
    - DEBUG
    - USE_CUSTOM_ALLOCATOR

cmake:
  build_type: Release
  options:
    CMAKE_EXPORT_COMPILE_COMMANDS: ON
    CMAKE_CONFIGURATION_TYPES: "Release;Debug"
    CMAKE_INSTALL_PREFIX: "/usr/local"